<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>비슷한 노래 찾기</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#1B1714">
<style>
  :root {
    --bg: #1B1714;
    --paper: #E8DCC3;
    --gold: #C89A3E;
    --teal: #2E6B63;
    --line: #4A423A;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--paper);
    font-family: var(--font-body);
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }
  html { overscroll-behavior-y: contain; }

  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }

  .page { display: none; }
  .page.active { display: block; animation: fadein 250ms ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .page.active { animation: none; }
  }

  /* ===== 1페이지: 레이블 그래픽 + 검색 ===== */
  .label-wrap { display: flex; justify-content: center; margin: 32px 0 40px; }
  .label {
    width: 140px; height: 140px; border-radius: 50%;
    background: conic-gradient(var(--gold) 0deg 180deg, var(--teal) 180deg 360deg);
    position: relative;
    border: 2px solid var(--paper);
  }
  .label::after {
    content: "";
    position: absolute; top: 50%; left: 50%;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg);
    transform: translate(-50%, -50%);
  }
  .label.spinning { animation: spin 1.2s linear infinite; }
  @media (prefers-reduced-motion: reduce) {
    .label.spinning { animation: none; opacity: 0.6; }
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .field { margin-bottom: 20px; }
  .field-caption {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--paper);
    opacity: 0.65;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--paper);
    font-family: var(--font-display);
    font-size: 20px;
    padding: 6px 2px;
  }
  .field input:focus-visible {
    outline: none;
    border-bottom-color: var(--gold);
  }
  .field input::placeholder { color: var(--line); }

  button {
    font-family: var(--font-body);
    cursor: pointer;
  }
  button:focus-visible {
    outline: 2px solid var(--paper);
    outline-offset: 2px;
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--paper);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 12px;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }

  .btn-row { display: flex; gap: 10px; margin-top: 8px; }
  .btn-secondary {
    flex: 1;
    padding: 12px;
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 14px;
  }

  .loading-msg {
    text-align: center;
    font-size: 13px;
    opacity: 0.7;
    margin-top: 12px;
    min-height: 18px;
  }

  /* ===== 2페이지: 결과 ===== */
  .side-block { margin-bottom: 28px; }
  .side-label {
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 0.15em;
    font-weight: 700;
    padding-bottom: 8px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .side-label.accuracy { color: var(--gold); }
  .side-label.diversity { color: var(--teal); }

  .track-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
  }
  .track-num {
    font-family: var(--font-mono);
    font-size: 13px;
    opacity: 0.5;
    width: 18px;
    flex-shrink: 0;
  }
  .track-art {
    width: 44px; height: 44px;
    border-radius: 3px;
    background: var(--line);
    flex-shrink: 0;
    object-fit: cover;
  }
  .track-meta { min-width: 0; }
  .track-title {
    font-family: var(--font-display);
    font-size: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-artist {
    font-size: 13px;
    opacity: 0.65;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .searched-heading {
    font-size: 13px;
    opacity: 0.6;
    margin-bottom: 20px;
  }
  .searched-heading b { color: var(--paper); opacity: 1; }

  .action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 24px;
  }

  .inquiry-panel {
    margin-top: 16px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    display: none;
  }
  .inquiry-panel.open { display: block; }
  .inquiry-panel textarea {
    width: 100%;
    min-height: 80px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--paper);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 8px;
    border-radius: 3px;
    resize: vertical;
  }
  .inquiry-panel textarea:focus-visible { outline: none; border-color: var(--gold); }
  .inquiry-status { font-size: 12px; opacity: 0.7; margin-top: 6px; min-height: 16px; }

  .error-box {
    text-align: center;
    padding: 40px 0;
    opacity: 0.8;
  }

  .version-tag {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10px;
    opacity: 0.4;
    margin-top: 32px;
  }
</style>
</head>
<body>

<div id="app">

  <!-- ===== 1페이지: 검색 ===== -->
  <section id="page-search" class="page active">
    <div class="label-wrap">
      <div class="label" id="label-graphic"></div>
    </div>

    <div class="field">
      <label class="field-caption" for="input-artist">ARTIST</label>
      <input type="text" id="input-artist" placeholder="가수 이름" autocomplete="off">
    </div>

    <div class="field">
      <label class="field-caption" for="input-track">TRACK</label>
      <input type="text" id="input-track" placeholder="곡 제목" autocomplete="off">
    </div>

    <button class="btn-primary" id="btn-search">찾기</button>
    <div class="loading-msg" id="search-status"></div>
  </section>

  <!-- ===== 2페이지: 결과 ===== -->
  <section id="page-result" class="page">
    <div class="searched-heading" id="searched-heading"></div>

    <div id="result-body">
      <!-- renderResultPage()가 채움 -->
    </div>

    <div class="action-grid">
      <button class="btn-secondary" id="btn-respin">다시 돌리기</button>
      <button class="btn-secondary" id="btn-share">공유하기</button>
      <button class="btn-secondary" id="btn-inquiry-toggle">문의하기</button>
      <button class="btn-secondary" id="btn-restart">다시찾기</button>
    </div>

    <div class="inquiry-panel" id="inquiry-panel">
      <textarea id="inquiry-text" placeholder="궁금한 점이나 의견을 적어주세요"></textarea>
      <button class="btn-secondary" id="btn-inquiry-send" style="margin-top:8px; width:100%;">보내기</button>
      <div class="inquiry-status" id="inquiry-status"></div>
    </div>
  </section>

  <div class="version-tag" id="version-tag">v1.0</div>
</div>

<script>
// ================= CONFIG =================
const CONFIG = {
  lastfmApiKey: '',                 // TODO: last.fm API 키 입력
  lastfmBaseUrl: 'https://ws.audioscrobbler.com/2.0/',
  itunesBaseUrl: 'https://itunes.apple.com/search',

  candidateLimit: 20,               // track.getSimilar 요청 개수
  accuracyPoolSize: 12,             // dedup 후 상위 N개 = accuracy pool
  diversityPoolSize: 8,             // 그 다음 N개 = diversity pool
  pickFromAccuracy: 3,              // 최종 결과 중 accuracy pool에서 뽑을 개수
  pickFromDiversity: 2,             // 최종 결과 중 diversity pool에서 뽑을 개수

  jsonpTimeoutMs: 5000,             // JSONP 공통 타임아웃 (last.fm, iTunes)

  emailjsServiceId: '',             // TODO
  emailjsTemplateId: '',            // TODO
  emailjsPublicKey: ''              // TODO
};

// ================= 상태 =================
const state = {
  pool: [],            // dedup 완료된 현재 검색의 후보 pool (match 내림차순)
  searchedArtist: '',
  searchedTrack: ''
};

// ================= JSONP 공통 유틸 =================
/**
 * JSONP 방식으로 외부 API 호출 (last.fm, iTunes 공통 - CORS 우회)
 * Args: url (string) - callback 파라미터를 제외한 요청 URL
 *       callbackParamName (string) - API별 콜백 파라미터 이름
 * Returns: Promise<object> - 파싱된 JSON 응답
 */
function jsonp(url, callbackParamName = 'callback') {
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonp_cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let timeoutId;

    function cleanup() {
      delete window[callbackName];
      if (script.parentNode) script.remove();
      clearTimeout(timeoutId);
    }

    window[callbackName] = (data) => {
      cleanup();
      resolve(data);
    };

    timeoutId = setTimeout(() => {
      cleanup();
      reject(new Error('jsonp_timeout'));
    }, CONFIG.jsonpTimeoutMs);

    const sep = url.includes('?') ? '&' : '?';
    script.src = `${url}${sep}${callbackParamName}=${callbackName}`;
    script.onerror = () => {
      cleanup();
      reject(new Error('jsonp_script_error'));
    };
    document.head.appendChild(script);
  });
}

// ================= last.fm 연동 =================
/**
 * 아티스트/곡명 오타 보정
 * Args: artist (string), track (string)
 * Returns: Promise<{artist:string, track:string}> - 보정 실패 시 원본 그대로 반환
 */
async function correctTrack(artist, track) {
  const url = `${CONFIG.lastfmBaseUrl}?method=track.getcorrection`
    + `&artist=${encodeURIComponent(artist)}&track=${encodeURIComponent(track)}`
    + `&api_key=${CONFIG.lastfmApiKey}&format=json`;
  try {
    const data = await jsonp(url);
    const corrected = data && data.corrections && data.corrections.correction
      && data.corrections.correction.track;
    if (corrected && corrected.artist && corrected.artist.name && corrected.name) {
      return { artist: corrected.artist.name, track: corrected.name };
    }
  } catch (e) {
    // 보정 실패 시 원본 사용 (아래로 폴스루)
  }
  return { artist, track };
}

/**
 * 유사곡 목록 조회 (match 내림차순으로 옴)
 * Args: artist (string), track (string)
 * Returns: Promise<Array<{name, artist, match}>>
 */
async function fetchSimilarTracks(artist, track) {
  const url = `${CONFIG.lastfmBaseUrl}?method=track.getsimilar`
    + `&artist=${encodeURIComponent(artist)}&track=${encodeURIComponent(track)}`
    + `&limit=${CONFIG.candidateLimit}&api_key=${CONFIG.lastfmApiKey}&format=json`;
  const data = await jsonp(url);
  const raw = data && data.similartracks && data.similartracks.track;
  if (!raw) return [];
  const arr = Array.isArray(raw) ? raw : [raw];
  return arr
    .filter(t => t.artist && t.artist.name && t.name)
    .map(t => ({
      name: t.name,
      artist: t.artist.name,
      match: parseFloat(t.match) || 0
    }));
}

/**
 * 아티스트 중복 제거 (첫 등장만 유지, 원래 순서 보존)
 * Args: tracks (Array)
 * Returns: Array - 아티스트당 1곡만 남은 배열
 */
function dedupByArtist(tracks) {
  const seen = new Set();
  return tracks.filter(t => {
    const key = t.artist.toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

/**
 * pool을 accuracy/diversity 구간으로 나누고 무작위 추출
 * Args: pool (Array) - dedup 완료, match 내림차순
 * Returns: {accuracy: Array, diversity: Array}
 */
function sampleRatio(pool) {
  const accuracyPool = pool.slice(0, CONFIG.accuracyPoolSize);
  const diversityPool = pool.slice(
    CONFIG.accuracyPoolSize,
    CONFIG.accuracyPoolSize + CONFIG.diversityPoolSize
  );
  return {
    accuracy: sampleRandom(accuracyPool, CONFIG.pickFromAccuracy),
    diversity: sampleRandom(diversityPool, CONFIG.pickFromDiversity)
  };
}

/** 배열에서 무작위 비복원 n개 추출. Args: arr, n. Returns: Array */
function sampleRandom(arr, n) {
  const copy = [...arr];
  const result = [];
  for (let i = 0; i < n && copy.length > 0; i++) {
    const idx = Math.floor(Math.random() * copy.length);
    result.push(copy.splice(idx, 1)[0]);
  }
  return result;
}

// ================= iTunes 앨범아트 =================
/**
 * iTunes Search API로 앨범아트 조회 (last.fm image 필드는 신뢰도가 낮아 미사용)
 * Args: artist (string), track (string)
 * Returns: Promise<string|null> - 앨범아트 URL, 실패 시 null
 */
async function fetchAlbumArt(artist, track) {
  try {
    const term = encodeURIComponent(`${artist} ${track}`);
    const url = `${CONFIG.itunesBaseUrl}?term=${term}&media=music&entity=song&limit=1`;
    const data = await jsonp(url);
    const result = data && data.results && data.results[0];
    if (!result || !result.artworkUrl100) return null;
    return result.artworkUrl100.replace('100x100', '200x200');
  } catch (e) {
    return null;
  }
}

// ================= 화면 전환 =================
/** Args: pageId (string). Returns: 없음 */
function goToPage(pageId) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
}

/** Args: on (boolean). Returns: 없음 */
function showLoading(on) {
  document.getElementById('label-graphic').classList.toggle('spinning', on);
  document.getElementById('btn-search').disabled = on;
  document.getElementById('search-status').textContent = on ? '찾는 중...' : '';
}

// ================= 검색 흐름 =================
async function handleSearch() {
  const artistInput = document.getElementById('input-artist').value.trim();
  const trackInput = document.getElementById('input-track').value.trim();
  if (!artistInput || !trackInput) {
    document.getElementById('search-status').textContent = '아티스트와 곡명을 모두 입력해주세요.';
    return;
  }

  showLoading(true);
  try {
    const corrected = await correctTrack(artistInput, trackInput);
    const rawTracks = await fetchSimilarTracks(corrected.artist, corrected.track);
    const deduped = dedupByArtist(rawTracks);

    if (deduped.length === 0) {
      showLoading(false);
      renderErrorState('그런 곡은 찾을 수 없어요. 아티스트명과 곡명을 다시 확인해주세요.');
      goToPage('page-result');
      return;
    }

    state.pool = deduped;
    state.searchedArtist = corrected.artist;
    state.searchedTrack = corrected.track;

    await respin();
    showLoading(false);
    goToPage('page-result');
  } catch (e) {
    showLoading(false);
    renderErrorState('지금 서버가 혼잡해요. 잠시 후 다시 시도해주세요.');
    goToPage('page-result');
  }
}

/**
 * 캐시된 pool에서 다시 무작위 추출 (API 재호출 없음, 앨범아트만 새로 조회)
 * Args: 없음 (state 사용)
 * Returns: Promise<void>
 */
async function respin() {
  const picked = sampleRatio(state.pool);

  const withArt = async (list) => Promise.all(list.map(async t => ({
    ...t,
    art: await fetchAlbumArt(t.artist, t.name)
  })));

  const [accuracyWithArt, diversityWithArt] = await Promise.all([
    withArt(picked.accuracy),
    withArt(picked.diversity)
  ]);

  renderResultPage(accuracyWithArt, diversityWithArt);
}

// ================= 렌더링 =================
/** Args: tracks (Array), side ('accuracy'|'diversity'). Returns: string (HTML) */
function renderTrackRows(tracks, side) {
  if (tracks.length === 0) return '';
  return tracks.map((t, i) => `
    <div class="track-row">
      <span class="track-num">${i + 1}</span>
      ${t.art ? `<img class="track-art" src="${t.art}" alt="">` : `<div class="track-art"></div>`}
      <div class="track-meta">
        <div class="track-title">${escapeHtml(t.name)}</div>
        <div class="track-artist">${escapeHtml(t.artist)}</div>
      </div>
    </div>
  `).join('');
}

/** Args: accuracyTracks, diversityTracks. Returns: 없음 (DOM 갱신) */
function renderResultPage(accuracyTracks, diversityTracks) {
  document.getElementById('searched-heading').innerHTML =
    `<b>${escapeHtml(state.searchedArtist)} - ${escapeHtml(state.searchedTrack)}</b>와 비슷한 노래`;

  let html = '';
  if (accuracyTracks.length > 0) {
    html += `<div class="side-block">
      <div class="side-label accuracy">A-SIDE</div>
      ${renderTrackRows(accuracyTracks, 'accuracy')}
    </div>`;
  }
  if (diversityTracks.length > 0) {
    html += `<div class="side-block">
      <div class="side-label diversity">B-SIDE</div>
      ${renderTrackRows(diversityTracks, 'diversity')}
    </div>`;
  }
  document.getElementById('result-body').innerHTML = html;
}

/** Args: message (string). Returns: 없음 */
function renderErrorState(message) {
  document.getElementById('searched-heading').textContent = '';
  document.getElementById('result-body').innerHTML =
    `<div class="error-box">${escapeHtml(message)}</div>`;
}

/** Args: str (string). Returns: string - HTML 이스케이프된 문자열 */
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ================= 공유하기 (canvas, 앨범아트 미포함 - taint 회피) =================
/**
 * 현재 결과를 텍스트+색상 카드로 그려서 공유
 * Args: 없음 (state, 현재 result-body DOM 사용)
 * Returns: Promise<void>
 */
async function handleShare() {
  const canvas = document.createElement('canvas');
  canvas.width = 800;
  canvas.height = 1000;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#1B1714';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#E8DCC3';
  ctx.font = '28px Georgia, serif';
  ctx.fillText(`${state.searchedArtist} - ${state.searchedTrack}`, 40, 70);
  ctx.font = '16px Georgia, serif';
  ctx.globalAlpha = 0.7;
  ctx.fillText('와 비슷한 노래', 40, 100);
  ctx.globalAlpha = 1;

  const rows = document.querySelectorAll('#result-body .track-row');
  let y = 160;
  rows.forEach((row) => {
    const title = row.querySelector('.track-title').textContent;
    const artist = row.querySelector('.track-artist').textContent;
    ctx.fillStyle = '#E8DCC3';
    ctx.font = '22px Georgia, serif';
    ctx.fillText(title, 40, y);
    ctx.globalAlpha = 0.65;
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillText(artist, 40, y + 24);
    ctx.globalAlpha = 1;
    y += 70;
  });

  canvas.toBlob(async (blob) => {
    const file = new File([blob], 'similar-songs.png', { type: 'image/png' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: '비슷한 노래 찾기' });
        return;
      } catch (e) {
        // 공유 취소/실패 시 아래 다운로드로 대체
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'similar-songs.png';
    a.click();
  });
}

// ================= 문의하기 (EmailJS) =================
/** Args: 없음. Returns: 없음 - 패널 토글 */
function toggleInquiryPanel() {
  document.getElementById('inquiry-panel').classList.toggle('open');
}

/** Args: 없음 (textarea 값 사용). Returns: Promise<void> */
async function sendInquiry() {
  const text = document.getElementById('inquiry-text').value.trim();
  const statusEl = document.getElementById('inquiry-status');
  if (!text) {
    statusEl.textContent = '내용을 입력해주세요.';
    return;
  }
  statusEl.textContent = '보내는 중...';
  try {
    await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service_id: CONFIG.emailjsServiceId,
        template_id: CONFIG.emailjsTemplateId,
        user_id: CONFIG.emailjsPublicKey,
        template_params: { message: text }
      })
    });
    statusEl.textContent = '보냈습니다.';
    document.getElementById('inquiry-text').value = '';
  } catch (e) {
    statusEl.textContent = '전송에 실패했어요. 잠시 후 다시 시도해주세요.';
  }
}

// ================= 이벤트 바인딩 =================
document.getElementById('btn-search').addEventListener('click', handleSearch);
document.getElementById('input-artist').addEventListener('keydown', e => { if (e.key === 'Enter') handleSearch(); });
document.getElementById('input-track').addEventListener('keydown', e => { if (e.key === 'Enter') handleSearch(); });

document.getElementById('btn-respin').addEventListener('click', respin);
document.getElementById('btn-share').addEventListener('click', handleShare);
document.getElementById('btn-inquiry-toggle').addEventListener('click', toggleInquiryPanel);
document.getElementById('btn-inquiry-send').addEventListener('click', sendInquiry);
document.getElementById('btn-restart').addEventListener('click', () => {
  document.getElementById('input-artist').value = '';
  document.getElementById('input-track').value = '';
  document.getElementById('inquiry-panel').classList.remove('open');
  goToPage('page-search');
});

// ================= Service Worker 등록 =================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
